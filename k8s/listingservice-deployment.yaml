apiVersion: apps/v1
kind: Deployment
metadata:
  name: listingservice-api-deployment
  labels:
    app: listingservice-api
spec:
  replicas: 3 # <-- X-axis scaling: 3 instances
  selector:
    matchLabels:
      app: listingservice-api
  template:
    metadata:
      labels:
        app: listingservice-api
    spec:
      containers:
        - name: listingservice-api-container
          image: localhost/synopsissi-listingservice.api:latest # Replace with your actual image path
          ports:
            - containerPort: 80 # Port the application listens on inside the container
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production" 
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__ListingServiceMongoDb
              value: "mongodb://your-mongo-host:27017/" # Ideally from K8s Secret/ConfigMap
            - name: MongoDbDatabaseName
              value: "SynopsisSI_ListingService_K8s"
            - name: CloudStorage__ServiceURL
              value: "http://your-minio-host:9000" # Ideally from K8s Secret/ConfigMap
            - name: CloudStorage__S3BucketName
              value: "ecommerce-bucket"
            - name: MessageBroker__RabbitMQ__Host
              value: "your-rabbitmq-host" # Ideally from K8s Secret/ConfigMap
            - name: JwtSettings__Issuer
              value: "SynopsisSI.UserService" # From K8s Secret/ConfigMap
            - name: JwtSettings__Audience
              value: "SynopsisSI.PlatformClients" # From K8s Secret/ConfigMap
            - name: JwtSettings__SecretKey
              valueFrom: # Example of fetching from a Kubernetes Secret
                secretKeyRef:
                  name: jwt-secrets
                  key: listingservice-jwt-secret
          # Liveness and Readiness Probes should be added for robust deployments
          livenessProbe:
            httpGet:
              path: /health/listings # Your health check endpoint
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/listings
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: listingservice-api-service
spec:
  selector:
    app: listingservice-api
  ports:
    - protocol: TCP
      port: 80       # Port the K8s service listens on
      targetPort: 80 # Port on the Pods/Containers
  type: LoadBalancer # Or ClusterIP (for internal access) or NodePort
