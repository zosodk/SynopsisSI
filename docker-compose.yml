services:
  synopsisgateway:
    build:
      context: .
      dockerfile: SynopsisSI.Gateway/Dockerfile
    container_name: synopsis-gateway
    ports:
      - "8080:8080"
    networks:
      - synopsis-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      listingservice.api:
        condition: service_healthy
    restart: unless-stopped
  
  listingservice.api:
    build:
      context: .
      dockerfile: ListingService.API/Dockerfile
    container_name: synopsis-listingservice-api
    networks:
      - synopsis-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__ListingServiceMongoDb=mongodb://mongoadmin:mongopassword@synopsis-mongodb:27017/
      - MongoDbDatabaseName=SynopsisSI_ListingService_Docker
      - CloudStorage__ServiceURL=http://synopsis-minio:9000
      - CloudStorage__S3BucketName=ecommerce-bucket
      - CloudStorage__Region=us-east-1
      - CloudStorage__S3ForcePathStyle=true
    depends_on:
      synopsis-mongodb:
        condition: service_healthy
      synopsis-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health/listings || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  
  synopsis-mongodb:
    image: mongo:latest # Updated version
    container_name: synopsis-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    volumes:
      - mongo_data:/data/db
    networks:
      - synopsis-network
    healthcheck:
      test: |
        mongosh --host localhost --port 27017 --eval \
        'db.runCommand("ping").ok' \
        --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  
  synopsis-redis:
    image: redis:latest # Updated version
    container_name: synopsis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synopsis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  
  synopsis-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z # Updated version
    container_name: synopsis-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_DEFAULT_BUCKETS: ecommerce-bucket
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - synopsis-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  synopsis-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  minio_data: