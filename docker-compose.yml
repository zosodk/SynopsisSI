services:
  synopsisgateway:
    build:
      context: .
      dockerfile: src/Gateways/SynopsisSI.Gateway/Dockerfile
    container_name: synopsis-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - synopsis-network
    depends_on:
      listingservice.api:
        condition: service_healthy
    restart: unless-stopped

  listingservice.api:
    build:
      context: .
      dockerfile: src/Services/ListingService/ListingService.API/Dockerfile
    container_name: synopsis-listingservice-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ListingServiceMongoDb=mongodb://mongoadmin:mongopassword@synopsis-mongodb:27017/
      - MongoDbDatabaseName=SynopsisSI_ListingService_Docker
      - CloudStorage__ServiceURL=http://synopsis-minio:9000
      - CloudStorage__S3BucketName=ecommerce-bucket
      - CloudStorage__Region=us-east-1
      - CloudStorage__S3ForcePathStyle=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health/listings || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - synopsis-network
    depends_on:
      synopsis-mongodb:
        condition: service_healthy
      synopsis-minio:
        condition: service_healthy
    restart: unless-stopped

  synopsis-mongodb:
    image: mongo:latest
    container_name: synopsis-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --host localhost --port 27017 --eval 'db.runCommand("ping").ok' --quiet
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - synopsis-network
    restart: unless-stopped

  synopsis-redis:
    image: redis:latest
    container_name: synopsis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - synopsis-network
    restart: unless-stopped

  synopsis-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: synopsis-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_DEFAULT_BUCKETS: ecommerce-bucket
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - synopsis-network
    restart: unless-stopped

networks:
  synopsis-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  minio_data: